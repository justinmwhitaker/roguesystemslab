[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prospector-cli"
version = "0.1.0"
description = "Terminal-first prospecting automation scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
prospector = "prospector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["prospector*"]
